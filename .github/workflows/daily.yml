name: Paint today's story

on:
  schedule:
    - cron: "49 11 * * *" # 11:49 UTC = 7:49am Toronto in summer, 6:49am in winter
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # A stuck API call would otherwise wait for GitHub's 6-hour limit.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add the newest story
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/update.mjs
      - name: Commit if something changed
        run: |
          if git diff --quiet stories.json; then
            echo "Nothing new to commit."
            exit 0
          fi
          git config user.name "wild-watercolors-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories.json
          git commit -m "Add today's story"
          git push

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect site files
        run: mkdir _site && cp index.html pecks.html pecks.css pecks.js phrases.js pecks-config.js pecks-art.js stories.json favicon.svg favicon.ico favicon-96.png favicon-32.png apple-touch-icon.png og-story.png og-pecks.png robots.txt sitemap.xml _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  alert:
    # Opens an issue (which emails you) if today's run broke or stories stopped arriving.
    needs: [update, deploy]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Open or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE: ${{ needs.update.result }}
          DEPLOY: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/alert.sh
