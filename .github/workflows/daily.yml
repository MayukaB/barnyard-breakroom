name: Paint today's story

on:
  schedule:
    - cron: "49 11 * * *" # 11:49 UTC = 7:49am Toronto in summer, 6:49am in winter
  workflow_dispatch:
    inputs:
      source:
        description: "Only try this source (mongabay). Leave empty to try every source."
        required: false
        default: ""
      extra:
        description: "Add a story even if today's is already up."
        type: boolean
        default: false
      repaint:
        description: "Repaint stories already on the site instead: a number (the newest that many) or story ids separated by spaces."
        required: false
        default: ""
  push:
    branches: [main]

# Nothing by default; each job below asks for only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # A stuck API call would otherwise wait for GitHub's 6-hour limit. A detailed painting can
    # take several minutes, and a repaint makes one call per story.
    timeout-minutes: 90
    permissions:
      contents: write # commit the new story
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Add the newest story
        # Stops before the job's own limit: a step that runs out of time fails (a job that does is
        # cancelled), so the commit step below still saves the stories a repaint already finished.
        timeout-minutes: 80
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ONLY_SOURCE: ${{ inputs.source }}
          EXTRA_STORY: ${{ inputs.extra && '1' || '' }}
          REPAINT: ${{ inputs.repaint }}
        run: node scripts/update.mjs
      - name: Commit if something changed
        # Also after a repaint that only partly worked, so the stories it did repaint are kept.
        if: success() || (failure() && inputs.repaint != '')
        env:
          MESSAGE: ${{ inputs.repaint != '' && 'Repaint stories' || 'Add today''s story' }}
        run: |
          if git diff --quiet public/stories.json; then
            echo "Nothing new to commit."
            exit 0
          fi
          git config user.name "wild-watercolors-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stories.json
          git commit -m "$MESSAGE"
          # Someone may have pushed to main during the run; put the story on top of their work.
          git pull --rebase origin main
          git push

  deploy:
    needs: update
    # A repaint that only partly worked still commits the stories it did repaint, so publish those too
    # (a commit pushed from inside a workflow doesn't start another run that would deploy it).
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped' || (needs.update.result == 'failure' && inputs.repaint != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the site
      pages: write # publish it
      id-token: write # prove to Pages that this run is allowed to publish
      actions: read # deploy-pages reads this run's uploaded site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public # everything in public/ is the site
      - id: deployment
        uses: actions/deploy-pages@v5

  alert:
    # Opens an issue (which emails you) if today's run broke or stories stopped arriving.
    needs: [update, deploy]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Open or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE: ${{ needs.update.result }}
          DEPLOY: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/alert.sh
