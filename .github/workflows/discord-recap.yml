name: Discord recap

# Posts a day's results in each Discord channel where the games were played
# (supabase/functions/discord-recap). The daily run comes from cron-job.org (see README), because
# GitHub's schedules are often late by an hour or more. This is for running it by hand, such as to
# redo a day. Does nothing until both secrets are set.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Day to recap (YYYY-MM-DD). Empty: yesterday. Channels that already have it are skipped."
        required: false

permissions: {}

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: ${{ secrets.DISCORD_RECAP_URL }}
      SECRET: ${{ secrets.RECAP_SECRET }}
      DATE: ${{ inputs.date }}
    steps:
      - name: Post the recaps
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then echo "DISCORD_RECAP_URL or RECAP_SECRET isn't set; skipping."; exit 0; fi
          body=$(jq -n --arg date "$DATE" 'if $date == "" then {} else {date: $date} end')
          curl --fail-with-body -sS -X POST "$URL" -H "x-recap-secret: $SECRET" -H "Content-Type: application/json" -d "$body"
