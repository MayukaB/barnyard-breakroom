name: Checks

# Runs on every push and pull request that touches the site, its scripts or its workflows,
# so a broken game, page, story script or spoiling phrase never reaches the live site.
# (The daily bot's story commits don't trigger it: GitHub doesn't start workflows from them.)
on:
  push:
    paths:
      - "public/**"
      - "*.js"
      - "*.json"
      - ".prettierrc.json"
      - ".prettierignore"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "public/**"
      - "*.js"
      - "*.json"
      - ".prettierrc.json"
      - ".prettierignore"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phrases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the phrase list and pictures
        run: node scripts/check-pecks.mjs
      - name: Check the Biscuit and Marshmallow boards
        run: node scripts/make-biscuit.mjs --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint the code
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Test the daily story script
        run: npm run test:scripts
      - name: Check the Node scripts parse
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
          bash -n scripts/alert.sh

  browser:
    # Plays Hen Pecks in a real browser (desktop and phone sizes): winning, losing,
    # hard mode, reloading, the story page card and upgrading old saved data.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the browser tests
        run: npx playwright test
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
